name: CALYRA Blitz selected-option text mutation native pixel proof

# One-shot source-pinned option-text experiment. Upstream is patched after verifying
# its pinned clean SHA. No CALYRA reference assets or original JS are changed.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-patched-dom:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install upstream build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev libfontconfig-dev libx11-dev libxkbcommon-dev libwayland-dev libasound2-dev git ca-certificates python3-venv
      - name: Pin Rust
        run: |
          rustup toolchain install 1.91.0 --profile minimal
          rustup default 1.91.0
          rustc --version
      - name: Pin canonical HTML, CSS and JS
        run: |
          set -euo pipefail
          echo '04635269a8fbd790c87316a03c6469a157806201e58fd730212f632fc86b7b9c  fixtures/reference.css' | sha256sum -c -
          echo '9d565203fc9c3450b0c61d7774cb2322b14ed3e3325926122b17f583e81cf3de  fixtures/reference.js' | sha256sum -c -
      - name: Clone pinned clean upstream source
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/DioxusLabs/blitz.git "$RUNNER_TEMP/blitz"
          git -C "$RUNNER_TEMP/blitz" checkout --detach 4f61cffacee50fe4f944ebe9d0470d9a5d3997e0
          test "$(git -C "$RUNNER_TEMP/blitz" rev-parse HEAD)" = 4f61cffacee50fe4f944ebe9d0470d9a5d3997e0
          test -z "$(git -C "$RUNNER_TEMP/blitz" status --porcelain --untracked-files=no)"
      - name: Apply pinned baseline and isolated noneditable SelectData adapter
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/native-stage-a/blitz-select-option-text
          sha256sum \
            native/blitz/patches/document-event-chain.patch \
            native/blitz/patches/plain-button-focus.patch \
            native/blitz/patches/select-ua-display.patch \
            native/blitz/patches/select-default-value.patch \
            native/blitz/patches/select-state-accessors.patch \
            native/blitz/patches/select-live-form-controls.patch \
            native/blitz/experiments/apply_readonly_select.py \
            native/blitz/experiments/apply_select_option_text_refresh.py \
            native/blitz/experiments/select_state_readonly.rs \
            native/blitz/experiments/calyra_option_text_screenshot.rs \
            native/blitz/patches/patched_option_text_regression.rs \
            native/blitz/reference_js_probe.rs \
            native/blitz/patches/patched_focus_regression.rs \
            native/blitz/patches/patched_readonly_select_regression.rs \
            > evidence/native-stage-a/blitz-select-option-text/source-sha256.txt
          for patch in \
            document-event-chain.patch plain-button-focus.patch \
            select-ua-display.patch select-default-value.patch \
            select-state-accessors.patch select-live-form-controls.patch; do
            echo "CALYRA_APPLY_PATCH=$patch"
            git -C "$RUNNER_TEMP/blitz" apply --check "$GITHUB_WORKSPACE/native/blitz/patches/$patch"
            git -C "$RUNNER_TEMP/blitz" apply "$GITHUB_WORKSPACE/native/blitz/patches/$patch"
          done
          python3 native/blitz/experiments/apply_readonly_select.py --source "$RUNNER_TEMP/blitz"
          python3 native/blitz/experiments/apply_select_option_text_refresh.py --source "$RUNNER_TEMP/blitz"
          grep -Fq "SpecialElementData::Select(_) => {}" "$RUNNER_TEMP/blitz/packages/blitz-dom/src/mutator.rs"
          cp native/blitz/experiments/select_state_readonly.rs \
            "$RUNNER_TEMP/blitz/packages/blitz-vibey-script/src/dom/element/select_state.rs"
          cp native/blitz/experiments/calyra_option_text_screenshot.rs \
            "$RUNNER_TEMP/blitz/examples/calyra_option_text_screenshot.rs"
          git -C "$RUNNER_TEMP/blitz" diff > evidence/native-stage-a/blitz-select-option-text/applied-upstream-diff.patch
          cp native/blitz/reference_js_probe.rs \
            "$RUNNER_TEMP/blitz/packages/blitz-vibey-script/tests/calyra_reference.rs"
          cat native/blitz/patches/patched_focus_regression.rs \
            native/blitz/patches/patched_readonly_select_regression.rs \
            native/blitz/patches/patched_option_text_regression.rs \
            >> "$RUNNER_TEMP/blitz/packages/blitz-vibey-script/tests/calyra_reference.rs"
      - name: Run original CALYRA script against patched native engine
        shell: bash
        env:
          CARGO_BUILD_JOBS: '2'
          CARGO_TERM_COLOR: never
        run: |
          set -o pipefail
          export CALYRA_CANONICAL_HTML="$GITHUB_WORKSPACE/fixtures/index.html"
          export CALYRA_CANONICAL_CSS="$GITHUB_WORKSPACE/fixtures/reference.css"
          export CALYRA_CANONICAL_JS="$GITHUB_WORKSPACE/fixtures/reference.js"
          export CALYRA_JS_OUT="$GITHUB_WORKSPACE/evidence/native-stage-a/blitz-select-option-text"
          test -d "$CALYRA_JS_OUT"
          echo "CALYRA_EVIDENCE_DIR=$CALYRA_JS_OUT"
          cd "$RUNNER_TEMP/blitz"
          cargo test --locked -p blitz-vibey-script --test calyra_reference -- --nocapture 2>&1 | tee "$CALYRA_JS_OUT/rust-test.log"
      - name: Verify read-only select state and native integration results
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('evidence/native-stage-a/blitz-select-option-text')
          for scene in ('focus-patched','destination-focus-patched','escape-patched'):
            report=json.loads((root/f'calyra-js-{scene}.json').read_text())
            assert report['reference_js_modified'] is False
            assert report['js_error_count']==0
            assert report['os_input_tested'] is False and report['gpu_tested'] is False
          live=json.loads((root/'calyra-js-select-live.json').read_text())
          assert live['reference_js_modified'] is False and live['js_error_count']==0
          assert live['observations']['same_node'] is True
          expected=[
            ('initial',0,'balanced','Balanced',[True,False,False],[False,False,False]),
            ('value=quality',1,'quality','Visual fidelity',[False,True,False],[False,False,False]),
            ('selectedIndex=2',2,'performance','Performance',[False,False,True],[False,False,False]),
            ('option0.selected=true',0,'balanced','Balanced',[True,False,False],[False,False,False]),
            ('value=nonexistent',-1,'','',[False,False,False],[False,False,False]),
            ('selectedIndex=1',1,'quality','Visual fidelity',[False,True,False],[False,False,False]),
            ('option2.defaultSelected=true',1,'quality','Visual fidelity',[False,True,False],[False,False,True]),
          ]
          observations=live['observations']['snapshots']
          assert len(observations)==len(expected)
          for snapshot,(name,index,value,label,selected,defaults) in zip(observations,expected):
            assert snapshot['name']==name,(name,snapshot)
            assert snapshot['js']=={'index':index,'value':value,'selected':selected,'defaultSelected':defaults,'events':[]},(name,snapshot)
            assert snapshot['native_label']==label,(name,snapshot)
          extra=json.loads((root/'calyra-js-option-text.json').read_text())
          assert extra['js_error_count']==0 and extra['observations']['same_node'] is True
          assert extra['observations']['native_label']=='Balanced live'
          assert extra['observations']['state']=={
              'value':'balanced','index':0,'selected':True,'text':'Balanced live','events':[]
          }
          print('PASS: seven existing states and reactive selected-option text without event dispatch')
          PY
      - name: Compile read-only native Vello CPU screenshot example
        shell: bash
        env:
          CARGO_BUILD_JOBS: '2'
          CARGO_TERM_COLOR: never
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/blitz"
          # Verify Document import and painter guard before the native build.
          grep -q "use blitz_dom::{Document, DocumentConfig" examples/calyra_option_text_screenshot.rs
          # paint_scene takes &mut BaseDocument, not the guard by value.
          grep -Fq "paint_scene(scene,&mut *doc.inner_mut()" examples/calyra_option_text_screenshot.rs
          cargo build --locked --release --example calyra_option_text_screenshot -j 2 2>&1 | tee "$GITHUB_WORKSPACE/evidence/native-stage-a/blitz-select-option-text/cargo-live-paint.log"
          test -x target/release/examples/calyra_option_text_screenshot
      - name: Capture same ScriptDocument before and after selected-option text mutation
        shell: bash
        run: |
          set -euo pipefail
          export CALYRA_CANONICAL_HTML="$GITHUB_WORKSPACE/fixtures/index.html"
          export CALYRA_CANONICAL_CSS="$GITHUB_WORKSPACE/fixtures/reference.css"
          export CALYRA_CANONICAL_JS="$GITHUB_WORKSPACE/fixtures/reference.js"
          export CALYRA_LIVE_PAINT_OUT="$GITHUB_WORKSPACE/evidence/native-stage-a/blitz-select-option-text"
          "$RUNNER_TEMP/blitz/target/release/examples/calyra_option_text_screenshot" 2>&1 | tee "$CALYRA_LIVE_PAINT_OUT/native-live-paint.log"
          grep -Fq 'CALYRA_LIVE_SELECT_DATA=read_only_no_editor' "$CALYRA_LIVE_PAINT_OUT/native-live-paint.log"
          grep -Fq 'CALYRA_OPTION_TEXT_UPDATED=true' "$CALYRA_LIVE_PAINT_OUT/native-live-paint.log"
          python3 -m venv "$RUNNER_TEMP/calyra-live-pillow"
          "$RUNNER_TEMP/calyra-live-pillow/bin/pip" install --disable-pip-version-check Pillow
          "$RUNNER_TEMP/calyra-live-pillow/bin/python" - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          from PIL import Image,ImageChops
          root=Path(os.environ['CALYRA_LIVE_PAINT_OUT'])
          before=root/'option-text-before.png'
          after=root/'option-text-after.png'
          assert before.is_file() and after.is_file()
          with Image.open(before) as a,Image.open(after) as b:
            assert a.size==b.size==(1060,800),(a.size,b.size)
            diff=ImageChops.difference(a.convert('RGB'),b.convert('RGB'))
            count=sum(1 for px in diff.getdata() if max(px)>=12)
            bbox=diff.getbbox()
            diff.save(root/'option-text-pixel-diff.png')
          assert count>=40,(count,bbox)
          assert bbox is not None and bbox[0]>=450 and bbox[2]<=950 and bbox[1]>=350 and bbox[3]<=650,(count,bbox)
          result={
            'schema':'calyra.blitz-option-text-paint.v1',
            'upstream_commit':'4f61cffacee50fe4f944ebe9d0470d9a5d3997e0',
            'renderer':'native Blitz AnyRender/Vello CPU',
            'control_state':'native noneditable SelectData',
            'same_document':True,'original_css_modified':False,
            'original_js_modified':False,'javascript_executed':True,
            'hardware_gpu':False,'os_input_tested':False,
            'old_label':'Balanced','new_label':'Balanced updated',
            'changed_pixels_at_12':count,'diff_bbox':bbox,
            'images':{p.name:hashlib.sha256(p.read_bytes()).hexdigest()
               for p in (before,after,root/'option-text-pixel-diff.png')}
          }
          (root/'option-text-result.json').write_text(json.dumps(result,indent=2)+'\n')
          print('PASS: same-document native selected-label pixels:',count,bbox)
          PY
      - name: Archive byte-exact native evidence in this same successful run
        # Avoid cross-run artifact tokens: the subsequent preservation workflow
        # could not download the artifact (Bad credentials) despite valid CI.
        shell: bash
        run: |
          set -euo pipefail
          root="evidence/native-stage-a/blitz-select-option-text"
          test -s "$root/option-text-before.png"
          test -s "$root/option-text-after.png"
          test -s "$root/option-text-pixel-diff.png"
          test -s "$root/option-text-result.json"
          sha256sum -c "$root/source-sha256.txt"
          "$RUNNER_TEMP/calyra-live-pillow/bin/python" - <<'PY'
          import hashlib,json,shutil
          from pathlib import Path
          from PIL import Image,ImageChops
          root=Path('evidence/native-stage-a/blitz-select-option-text')
          r=json.loads((root/'option-text-result.json').read_text())
          assert r['schema']=='calyra.blitz-option-text-paint.v1'
          assert r['upstream_commit']=='4f61cffacee50fe4f944ebe9d0470d9a5d3997e0'
          assert r['control_state']=='native noneditable SelectData'
          assert r['same_document'] is True
          assert r['original_css_modified'] is False and r['original_js_modified'] is False
          assert r['hardware_gpu'] is False and r['os_input_tested'] is False
          assert r['old_label']=='Balanced' and r['new_label']=='Balanced updated'
          for name in ('option-text-before.png','option-text-after.png','option-text-pixel-diff.png'):
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==r['images'][name]
          with Image.open(root/'option-text-before.png') as a,Image.open(root/'option-text-after.png') as b:
              assert a.size==b.size==(1060,800)
              d=ImageChops.difference(a.convert('RGB'),b.convert('RGB'))
              count=sum(1 for p in d.getdata() if max(p)>=12)
              bbox=d.getbbox()
              with Image.open(root/'option-text-pixel-diff.png') as stored:
                  assert stored.convert('RGB').tobytes()==d.tobytes()
          assert count==r['changed_pixels_at_12'] and count>=40
          assert bbox==tuple(r['diff_bbox'])
          assert 450<=bbox[0] and bbox[2]<=950 and 350<=bbox[1] and bbox[3]<=650
          js=json.loads((root/'calyra-js-select-live.json').read_text())
          assert js['js_error_count']==0 and js['observations']['same_node'] is True
          assert len(js['observations']['snapshots'])==7
          assert js['observations']['snapshots'][0]['native_label']=='Balanced'
          assert js['observations']['snapshots'][1]['native_label']=='Visual fidelity'
          assert all(not s['js']['events'] for s in js['observations']['snapshots'])
          option=json.loads((root/'calyra-js-option-text.json').read_text())
          assert option['js_error_count']==0 and option['observations']['native_label']=='Balanced live'
          assert option['observations']['state']['events']==[]
          rust=(root/'rust-test.log').read_text()
          assert 'test result: ok. 11 passed; 0 failed' in rust
          assert 'test calyra_select_has_no_editor_and_rejects_keyboard_ime_paste_edits ... ok' in rust
          assert 'test calyra_selected_option_text_mutation_refreshes_native_label ... ok' in rust
          assert 'CALYRA_LIVE_SELECT_DATA=read_only_no_editor' in (root/'native-live-paint.log').read_text()
          files=[p for p in root.rglob('*') if p.is_file()]
          assert len(files)>=17,len(files)
          dest=Path('docs/evidence/blitz-select-option-text')
          dest.mkdir(parents=True,exist_ok=True)
          for p in files:
              assert not p.is_symlink()
              target=dest/p.relative_to(root)
              target.parent.mkdir(parents=True,exist_ok=True)
              shutil.copyfile(p,target)
              assert hashlib.sha256(p.read_bytes()).digest()==hashlib.sha256(target.read_bytes()).digest()
          print('PASS:',len(files),'original files, selected-option text native Vello CPU pixels',count,bbox,'11/11 native Rust tests')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f docs/evidence/blitz-select-option-text/
          if git diff --cached --quiet; then
            echo "Identical original evidence already archived"
            exit 0
          fi
          git commit -m "docs(evidence): preserve native selected-option text pixels in same run"
          git push origin HEAD:feat/reference-fixtures

      - name: Preserve reproducibility and failed attempts
        if: always()
        run: |
          echo '### CALYRA native Blitz / read-only SelectData reactive rendering' >> "$GITHUB_STEP_SUMMARY"
          echo 'Upstream 4f61cff, modified only in disposable CI checkout. Original CALYRA CSS/JS untouched. Six baseline patches, noneditable SelectData adapter, targeted text invalidation. Canonical HTML/CSS/JS unchanged. No dropdown, OS input, a11y, GPU or browser-level parity.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Internal events and Vello CPU pixels only; no actual OS input, IME safety, GPU or production fix.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calyra-blitz-select-option-text-experiment
          path: evidence/native-stage-a/blitz-select-option-text/
          retention-days: 7
          if-no-files-found: warn
