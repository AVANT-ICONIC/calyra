name: CALYRA native live RangeData JS and two-frame Vello CPU pixel proof v4

on:
  push:
    branches: [feat/reference-fixtures]
    paths: [.github/workflows/blitz-native-range-regression.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  isolated-native-form-ax-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      CARGO_BUILD_JOBS: '3'
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: '1'
      OUT: evidence/blitz-native-range-regression
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/reference-fixtures
      - name: Record canonical source and pinned test adapters
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          python3 adapters/tauri-reference/verify_source.py \
            | tee "$OUT/verified-source.json"
          grep -Fq '"pass": true' "$OUT/verified-source.json"
          sha256sum fixtures/index.html fixtures/reference.css fixtures/reference.js \
            native/blitz/experiments/apply_ax_form_semantics.py \
            native/blitz/experiments/ax_form_semantics_regression.rs \
            native/blitz/experiments/apply_range_state_paint.py \
            native/blitz/experiments/range_state.rs \
            native/blitz/experiments/range_js_semantics.rs \
            native/blitz/experiments/calyra_live_range_screenshot.rs \
            native/blitz/experiments/apply_readonly_select.py \
            native/blitz/experiments/select_state_readonly.rs \
            native/blitz/patches/document-event-chain.patch \
            native/blitz/patches/plain-button-focus.patch \
            native/blitz/patches/select-ua-display.patch \
            native/blitz/patches/select-default-value.patch \
            native/blitz/patches/select-state-accessors.patch \
            native/blitz/patches/select-live-form-controls.patch \
            > "$OUT/verified-source-sha256.txt"
          { lsb_release -a || true; uname -m; rustc --version; } \
            > "$OUT/host.txt" 2>&1
      - name: Install toolchain and native dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libfontconfig-dev \
            libx11-dev libxkbcommon-dev libwayland-dev libasound2-dev \
            ca-certificates python3-venv > "$OUT/apt.log" 2>&1
          rustup toolchain install 1.91.0 --profile minimal > "$OUT/rustup.log" 2>&1
          rustup default 1.91.0
          rustc --version | tee "$OUT/rust-version.txt"
      - name: Exact pinned Blitz checkout with experimental patches only
        shell: bash
        run: |
          set -euo pipefail
          O="$GITHUB_WORKSPACE/$OUT"
          git clone --filter=blob:none https://github.com/DioxusLabs/blitz.git \
            "$RUNNER_TEMP/calyra-blitz-ax-regression" > "$O/clone.log" 2>&1
          git -C "$RUNNER_TEMP/calyra-blitz-ax-regression" checkout --detach \
            4f61cffacee50fe4f944ebe9d0470d9a5d3997e0 \
            > "$O/checkout.log" 2>&1
          test "$(git -C "$RUNNER_TEMP/calyra-blitz-ax-regression" rev-parse HEAD)" = \
            4f61cffacee50fe4f944ebe9d0470d9a5d3997e0
          test -z "$(git -C "$RUNNER_TEMP/calyra-blitz-ax-regression" status --porcelain --untracked-files=no)"
          for patch in \
            document-event-chain.patch plain-button-focus.patch \
            select-ua-display.patch select-default-value.patch \
            select-state-accessors.patch select-live-form-controls.patch; do
            echo "$patch" >> "$O/patch-order.txt"
            git -C "$RUNNER_TEMP/calyra-blitz-ax-regression" apply --check \
              "$GITHUB_WORKSPACE/native/blitz/patches/$patch"
            git -C "$RUNNER_TEMP/calyra-blitz-ax-regression" apply \
              "$GITHUB_WORKSPACE/native/blitz/patches/$patch"
          done
          python3 native/blitz/experiments/apply_readonly_select.py \
            --source "$RUNNER_TEMP/calyra-blitz-ax-regression" \
            | tee "$O/select-patch.log"
          cp native/blitz/experiments/select_state_readonly.rs \
            "$RUNNER_TEMP/calyra-blitz-ax-regression/packages/blitz-vibey-script/src/dom/element/select_state.rs"
          python3 native/blitz/experiments/apply_ax_form_semantics.py \
            --source "$RUNNER_TEMP/calyra-blitz-ax-regression" \
            | tee "$O/ax-form-patch.log"
          cp native/blitz/experiments/range_state.rs \
            "$RUNNER_TEMP/calyra-blitz-ax-regression/packages/blitz-dom/src/node/range.rs"
          python3 native/blitz/experiments/apply_range_state_paint.py \
            --source "$RUNNER_TEMP/calyra-blitz-ax-regression" \
            | tee "$O/native-range-patch.log"
          cp native/blitz/experiments/calyra_live_range_screenshot.rs \
            "$RUNNER_TEMP/calyra-blitz-ax-regression/examples/calyra_live_range_screenshot.rs"
          cp native/blitz/experiments/range_js_semantics.rs \
            "$RUNNER_TEMP/calyra-blitz-ax-regression/packages/blitz-vibey-script/tests/calyra_range.rs"
          cp native/blitz/experiments/ax_form_semantics_regression.rs \
            "$RUNNER_TEMP/calyra-blitz-ax-regression/tests/blitz-tests/tests/calyra_ax_form_semantics.rs"
          echo 'mod calyra_ax_form_semantics;' >> \
            "$RUNNER_TEMP/calyra-blitz-ax-regression/tests/blitz-tests/tests/all.rs"
          git -C "$RUNNER_TEMP/calyra-blitz-ax-regression" diff \
            > "$O/exact-upstream-ax-experiment.patch"
          test -s "$O/exact-upstream-ax-experiment.patch"
          sha256sum "$RUNNER_TEMP/calyra-blitz-ax-regression/Cargo.lock" \
            > "$O/pinned-cargo-lock-sha256.txt"
      - name: Compile/run actual native Rust AccessKit regression
        shell: bash
        run: |
          set -euo pipefail
          O="$GITHUB_WORKSPACE/$OUT"
          cd "$RUNNER_TEMP/calyra-blitz-ax-regression"
          set +e
          cargo test --locked -p blitz-tests --test all calyra_ax_ -- --nocapture \
            > "$O/native-rust-test.log" 2>&1
          code=$?
          set -e
          tail -n 160 "$O/native-rust-test.log"
          echo "$code" > "$O/native-test-exit-code.txt"
          test "$code" -eq 0
          grep -Fq 'test result: ok. 16 passed; 0 failed' "$O/native-rust-test.log"
          printf '%s\n' '16 source-pinned native AX and RangeData regression cases passed' \
            | tee "$O/regression-verdict.txt"
      - name: Verify actual Boa JS range getter/setter and absence of synthetic input/change
        shell: bash
        run: |
          set -euo pipefail
          O="$GITHUB_WORKSPACE/$OUT"
          cd "$RUNNER_TEMP/calyra-blitz-ax-regression"
          set +e
          cargo test --locked -p blitz-vibey-script --test calyra_range -- --nocapture \
            > "$O/native-boa-range-js-test.log" 2>&1
          code=$?
          set -e
          echo "$code" > "$O/native-boa-range-js-exit-code.txt"
          tail -n 120 "$O/native-boa-range-js-test.log"
          test "$code" -eq 0
          grep -Fq 'test result: ok. 3 passed; 0 failed' "$O/native-boa-range-js-test.log"
          echo "3/3 actual Boa JS range DOM accessors PASS" \
            | tee "$O/native-boa-range-js-verdict.txt"

      - name: Render true same-document native Vello CPU frames before/after Boa range value mutation
        shell: bash
        run: |
          set -euo pipefail
          O="$GITHUB_WORKSPACE/$OUT"
          cd "$RUNNER_TEMP/calyra-blitz-ax-regression"
          set +e
          cargo build --locked --example calyra_live_range_screenshot -j 3 \
            > "$O/native-range-live-build.log" 2>&1
          code=$?
          set -e
          echo "$code" > "$O/native-range-live-build-exit-code.txt"
          tail -n 100 "$O/native-range-live-build.log"
          test "$code" -eq 0
          test -x target/debug/examples/calyra_live_range_screenshot
          export CALYRA_CANONICAL_HTML="$GITHUB_WORKSPACE/fixtures/index.html"
          export CALYRA_CANONICAL_CSS="$GITHUB_WORKSPACE/fixtures/reference.css"
          export CALYRA_CANONICAL_JS="$GITHUB_WORKSPACE/fixtures/reference.js"
          export CALYRA_LIVE_RANGE_OUT="$O"
          target/debug/examples/calyra_live_range_screenshot \
            > "$O/native-range-live-frames.log" 2>&1
          cat "$O/native-range-live-frames.log"
          grep -Fq 'CALYRA_RANGE_SAME_DOCUMENT=true' "$O/native-range-live-frames.log"
          grep -Fq 'CALYRA_RANGE_FINAL_VALUE=18' "$O/native-range-live-frames.log"
          python3 -m venv "$RUNNER_TEMP/calyra-range-pillow"
          "$RUNNER_TEMP/calyra-range-pillow/bin/pip" \
            install --disable-pip-version-check Pillow \
            > "$O/pillow-install.log" 2>&1
          "$RUNNER_TEMP/calyra-range-pillow/bin/python" - <<'PY'
          from PIL import Image,ImageChops
          from pathlib import Path
          import hashlib,json,os
          out=Path(os.environ['CALYRA_LIVE_RANGE_OUT'])
          before=out/'range-before-64.png'
          after=out/'range-after-18.png'
          assert before.is_file() and after.is_file()
          with Image.open(before) as a,Image.open(after) as b:
            assert a.size==b.size==(1060,800),(a.size,b.size)
            difference=ImageChops.difference(a.convert('RGB'),b.convert('RGB'))
            changed=sum(1 for p in difference.getdata() if max(p)>=12)
            bbox=difference.getbbox()
            difference.save(out/'range-live-pixel-diff.png')
          assert changed >= 50,(changed,bbox)
          assert bbox is not None and bbox[0]>=150 and bbox[2]<=1050,(changed,bbox)
          assert bbox[1]>=400 and bbox[3]<=800,(changed,bbox)
          assert bbox[3]-bbox[1]<=95,(changed,bbox)
          result={
            'schema':'calyra.blitz-range-live-same-document-vello-cpu.v1',
            'real_renderer':'AnyRender / Vello CPU',
            'one_script_document':True,
            'same_range_dom_node':True,
            'first_native_current':64,'second_native_current':18,
            'html_default_remains':64,
            'original_html_css_js_unchanged':True,
            'original_javascript_executed':True,
            'actual_os_user_input_tested':False,
            'hardware_gpu_tested':False,
            'range_drag_keyboard_tested':False,
            'changed_pixels_threshold_12':changed,
            'diff_bbox':bbox,
            'images_sha256':{
              p.name:hashlib.sha256(p.read_bytes()).hexdigest()
              for p in (before,after,out/'range-live-pixel-diff.png')
            },
          }
          (out/'range-live-paint-verdict.json').write_text(
            json.dumps(result,indent=2,sort_keys=True)+'\n')
          print('Native same-document 64 -> 18 slider pixel count:',changed,bbox)
          PY

      - name: Preserve actual source-pinned test evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          DEST=docs/evidence/blitz-native-range-regression
          mkdir -p "$DEST"
          cp -p "$OUT"/*.json "$OUT"/*.txt "$OUT"/*.log "$OUT"/*.patch \
            "$OUT"/*.png "$DEST"/
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('docs/evidence/blitz-native-range-regression')
          files={p.name:hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in root.iterdir() if p.is_file()}
          (root/'original-file-sha256.json').write_text(
              json.dumps(files,indent=2,sort_keys=True)+'\n')
          print('Preserved',len(files),'original Linux native regression records')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$DEST"/
          git diff --cached --quiet && exit 0
          git commit -m "test(evidence): archive source-pinned native RangeData and AX regression"
          git fetch origin feat/reference-fixtures
          git rebase origin/feat/reference-fixtures
          git push origin HEAD:refs/heads/feat/reference-fixtures
      - name: State diagnostic scope without overclaiming
        if: always()
        shell: bash
        run: |
          echo '### CALYRA: pinned RangeData, native Boa JS and same-document Vello CPU pixels' >> "$GITHUB_STEP_SUMMARY"
          echo 'These Rust unit tests do not prove macOS AX output, keyboard/IME, pointer, native popups, or the complete HTML-AAM name algorithm.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calyra-blitz-native-range-rust-regression
          path: |
            evidence/blitz-native-range-regression/*.json
            evidence/blitz-native-range-regression/*.txt
            evidence/blitz-native-range-regression/*.log
            evidence/blitz-native-range-regression/*.patch
            evidence/blitz-native-range-regression/*.png
          retention-days: 14
          if-no-files-found: warn
