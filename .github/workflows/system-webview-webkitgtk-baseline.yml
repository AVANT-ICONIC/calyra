name: CALYRA Linux system WebView WebKitGTK Stage A

# One-shot actual OS-WebKit engine probe. NOT a Tauri shell or macOS result.
on:
  push:
    branches: [feat/reference-fixtures]
    paths: [.github/workflows/system-webview-webkitgtk-baseline.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  webkitgtk-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GDK_BACKEND: x11
      GDK_SCALE: '1'
      GDK_DPI_SCALE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install distro WebKitGTK 4.1 and headless X11 dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gir1.2-webkit2-4.1 gir1.2-gtk-3.0 python3-gi python3-gi-cairo \
            python3-cairo python3-pil xvfb xauth fonts-dejavu-core \
            libcairo2 libgtk-3-0 libwebkit2gtk-4.1-0 procps
          /usr/bin/python3 - <<'PY'
          import gi
          gi.require_version('Gtk','3.0')
          gi.require_version('WebKit2','4.1')
          from gi.repository import Gtk,WebKit2
          print('GTK', Gtk.get_major_version(), Gtk.get_minor_version())
          print('WebKitGTK',WebKit2.get_major_version(), WebKit2.get_minor_version(),WebKit2.get_micro_version())
          print('WebView has get_snapshot:', hasattr(WebKit2.WebView,'get_snapshot'))
          print('WebView has run_javascript:', hasattr(WebKit2.WebView,'run_javascript'))
          assert hasattr(WebKit2.WebView,'get_snapshot') and hasattr(WebKit2.WebView,'run_javascript')
          PY
      - name: Pin original CALYRA source assets and capture source hashes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/system-webview/linux-webkitgtk
          echo 'aa9fa23b242f06be7dc5b760f0f8379ce750d8fe2cd67a977daf1a4ff1bd848a  fixtures/index.html' | sha256sum -c -
          echo '04635269a8fbd790c87316a03c6469a157806201e58fd730212f632fc86b7b9c  fixtures/reference.css' | sha256sum -c -
          echo '9d565203fc9c3450b0c61d7774cb2322b14ed3e3325926122b17f583e81cf3de  fixtures/reference.js' | sha256sum -c -
          sha256sum adapters/system-webview/webkitgtk_probe.py harness/verify_webkitgtk_baseline.py fixtures/index.html fixtures/reference.css fixtures/reference.js > evidence/system-webview/linux-webkitgtk/source-sha256.txt
          {
            echo "runner=ubuntu-24.04"
            uname -a
            /usr/bin/python3 --version
            dpkg -l libwebkit2gtk-4.1-0 gir1.2-webkit2-4.1 libgtk-3-0 xvfb
            command -v xvfb-run
          } > evidence/system-webview/linux-webkitgtk/environment.txt
      - name: Run original HTML CSS and JS in four genuine GTK WebKit views
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1600x1200x24 -nolisten tcp' bash -euo pipefail -c '
            for fixture in controls dashboard visual interaction; do
              echo "CALYRA_START_WEBKIT_FIXTURE=$fixture"
              /usr/bin/python3 adapters/system-webview/webkitgtk_probe.py \
                --html fixtures/index.html --fixture "$fixture" \
                --out evidence/system-webview/linux-webkitgtk \
                2>&1 | tee "evidence/system-webview/linux-webkitgtk/$fixture.log"
            done
          '
      - name: Independently verify all real WebKitGTK PNGs and JavaScript states
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 harness/verify_webkitgtk_baseline.py \
            --out evidence/system-webview/linux-webkitgtk --fixtures fixtures \
            | tee evidence/system-webview/linux-webkitgtk/verification.log
          sha256sum -c evidence/system-webview/linux-webkitgtk/source-sha256.txt
      - name: Archive original evidence on research branch only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,shutil
          from pathlib import Path
          root=Path('evidence/system-webview/linux-webkitgtk')
          assert (root/'verification.json').is_file()
          sources=list(root.rglob('*'))
          files=[p for p in sources if p.is_file()]
          assert len(files)>=18,len(files)
          dest=Path('docs/evidence/webkitgtk-linux-stage-a')
          dest.mkdir(parents=True,exist_ok=True)
          for file in files:
              assert not file.is_symlink()
              target=dest/file.relative_to(root)
              target.parent.mkdir(parents=True,exist_ok=True)
              shutil.copyfile(file,target)
              assert hashlib.sha256(file.read_bytes()).digest()==hashlib.sha256(target.read_bytes()).digest()
          print(f'PASS: staged {len(files)} verified WebKitGTK original files for branch archival')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f docs/evidence/webkitgtk-linux-stage-a/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs(evidence): preserve real Linux WebKitGTK system-WebView proof"
          git push origin HEAD:feat/reference-fixtures
      - name: Summarize exact platform and test limitations
        if: always()
        shell: bash
        run: |
          echo '### CALYRA system-WebView engine (WebKitGTK on Linux)' >> "$GITHUB_STEP_SUMMARY"
          echo 'This tests native GTK3 WebKitGTK 4.1, not Tauri shell or macOS WKWebView. Interactions via JavaScript synthetic/untrusted events only. Xvfb screenshots are real OS-WebKit Cairo snapshots. One run only; no hardware GPU, trusted input, accessibility, comparative CPU/RAM, or measured performance advantage.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calyra-linux-webkitgtk-original-evidence
          path: evidence/system-webview/linux-webkitgtk/
          retention-days: 14
          if-no-files-found: warn
