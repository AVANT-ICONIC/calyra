name: CALYRA actual Tauri 2 Linux native shell compile and Xvfb launch

# Secondary buildability check while GitHub macOS-15 ARM64 runner is queued.
# Linux WebKitGTK Tauri executable is NOT macOS WKWebView evidence.
on:
  push:
    branches: [feat/reference-fixtures]
    paths: [.github/workflows/tauri-linux-shell-smoke.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-tauri-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install official Tauri 2 Linux native dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev pkg-config build-essential \
            xvfb xauth fonts-dejavu-core
          mkdir -p evidence/tauri-linux-shell
          {
            uname -a
            rustc --version
            cargo --version
            node --version
            npm --version
            pkg-config --modversion webkit2gtk-4.1
          } > evidence/tauri-linux-shell/environment.txt
      - name: Validate canonical fixtures, generate Linux PNG and install exact CLI
        shell: bash
        run: |
          set -euo pipefail
          python3 adapters/tauri-reference/verify_source.py | tee evidence/tauri-linux-shell/source-contract.json
          python3 adapters/tauri-reference/prepare_macos_icon.py | tee evidence/tauri-linux-shell/icon-generation.log
          test -s adapters/tauri-reference/src-tauri/icons/calyra-reference-source.png
          shasum -a 256 fixtures/index.html fixtures/reference.css fixtures/reference.js \
            adapters/tauri-reference/src-tauri/icons/calyra-reference-source.png \
            > evidence/tauri-linux-shell/source-sha256.txt
          cd adapters/tauri-reference
          npm install --no-audit --no-fund 2>&1 | tee "$GITHUB_WORKSPACE/evidence/tauri-linux-shell/npm-install.log"
          ./node_modules/.bin/tauri --version | tee "$GITHUB_WORKSPACE/evidence/tauri-linux-shell/tauri-cli-version.txt"
      - name: Compile actual Tauri 2 Linux system-WebView executable
        shell: bash
        run: |
          set -euo pipefail
          cd adapters/tauri-reference
          npm run tauri -- build --debug --no-bundle \
            2>&1 | tee "$GITHUB_WORKSPACE/evidence/tauri-linux-shell/native-build.log"
          test -x src-tauri/target/debug/calyra-tauri-reference
          cp src-tauri/Cargo.lock "$GITHUB_WORKSPACE/evidence/tauri-linux-shell/Cargo.lock"
          cp package-lock.json "$GITHUB_WORKSPACE/evidence/tauri-linux-shell/package-lock.json"
          file src-tauri/target/debug/calyra-tauri-reference \
            | tee "$GITHUB_WORKSPACE/evidence/tauri-linux-shell/executable-file-type.txt"
      - name: Launch the actual Tauri WebKitGTK executable under Xvfb
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1600x1200x24 -nolisten tcp' bash -euo pipefail -c '
            export GDK_BACKEND=x11
            export LIBGL_ALWAYS_SOFTWARE=1
            export WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1
            bin=adapters/tauri-reference/src-tauri/target/debug/calyra-tauri-reference
            "$bin" > evidence/tauri-linux-shell/native-runtime.log 2>&1 &
            pid=$!
            trap "kill $pid >/dev/null 2>&1 || true" EXIT
            sleep 6
            kill -0 "$pid"
            echo CALYRA_NATIVE_TAURI_LINUX_PROCESS_ALIVE=true | tee evidence/tauri-linux-shell/runtime-summary.txt
            ps -p "$pid" -o pid,ppid,rss,comm >> evidence/tauri-linux-shell/runtime-summary.txt
          '
      - name: Record platform and performance boundaries
        if: always()
        shell: bash
        run: |
          echo 'Real Tauri 2 Linux WebKitGTK native binary compile/Xvfb launch smoke; not macOS WKWebView or a bundled .app. No true OS input, accessibility, first-pixel screenshot, GPU benchmark, or repeatable measured performance. Do not compare this debug executable with optimized native Blitz.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calyra-native-tauri-linux-smoke
          path: evidence/tauri-linux-shell/
          retention-days: 14
          if-no-files-found: warn
