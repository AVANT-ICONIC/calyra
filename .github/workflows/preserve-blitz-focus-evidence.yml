name: Preserve CALYRA Blitz focus evidence

# One-shot upload of exact, SHA-256-verified native Rust test evidence.
on:
  push:
    branches: [feat/reference-fixtures]
    paths: [.github/workflows/preserve-blitz-focus-evidence.yml]

permissions:
  contents: write
  actions: read

jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Download original native focus experiment artifact
        uses: actions/download-artifact@v4
        with:
          name: calyra-blitz-focus-patched-experiment
          run-id: 43687424754
          github-token: ${{ github.token }}
          path: original
      - name: Verify exact file bytes, patches and observable outcomes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, shutil
          from pathlib import Path
          originals=Path('original')
          dest=Path('docs/evidence/blitz-focus')
          expected={
            'calyra-js-focus-patched.json':'baeddf5043b462b3e1b55e023351ca6987faa3fe356df7d5d3435313bbd54870',
            'calyra-js-destination-focus-patched.json':'b5d67d49404e661532f81165a83e9023d9739ff81f1359e445f78d1627f89463',
            'applied-upstream-diff.patch':'b5352edc1092bb3b7ed815d0e758b2965719631b9a8088ef738f6d1f17f17e3b',
            'source-sha256.txt':'4649dfa2c805567cdbf49fb576ce43b5c135f0477160246b204b076c4d0b49ef'
          }
          for name,sha in expected.items():
              assert len(sha)==64
              assert hashlib.sha256((originals/name).read_bytes()).hexdigest()==sha,name
          focus=json.loads((originals/'calyra-js-focus-patched.json').read_text())
          dest_focus=json.loads((originals/'calyra-js-destination-focus-patched.json').read_text())
          for result in (focus,dest_focus):
              assert result['schema']=='calyra.blitz-js.v1'
              assert result['reference_js_modified'] is False
              assert result['os_input_tested'] is False
              assert result['gpu_tested'] is False
              assert result['js_error_count']==0
          f=focus['observations']
          assert f['native_command_focused'] is True
          assert f['after_open']=={'expanded':'true','hidden':False,'focused':'inspect'}
          assert f['after_escape']=={'expanded':'false','hidden':True,'focused':'menu-toggle'}
          d=dest_focus['observations']
          assert d['native_destination_focused'] is True
          assert d['after_click']['focused']=='destination'
          assert d['after_click']['status']=='Destination focused'
          diff=(originals/'applied-upstream-diff.patch').read_text()
          assert 'packages/blitz-dom/src/events/pointer.rs' in diff
          assert 'packages/blitz-dom/src/traversal.rs' in diff
          assert 'local_name!("button") if el.attr(local_name!("type")) == Some("button")' in diff
          assert '|| *id == self.root_node().id' in diff
          assert hashlib.sha256(Path('fixtures/reference.js').read_bytes()).hexdigest()=='9d565203fc9c3450b0c61d7774cb2322b14ed3e3325926122b17f583e81cf3de'
          assert hashlib.sha256(Path('fixtures/reference.css').read_bytes()).hexdigest()=='04635269a8fbd790c87316a03c6469a157806201e58fd730212f632fc86b7b9c'
          dest.mkdir(parents=True,exist_ok=True)
          for name in expected:
              shutil.copyfile(originals/name,dest/name)
          print('PASS: exact focus evidence and both engine patches verified')
          PY
      - name: Commit only authenticated evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/evidence/blitz-focus/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs(evidence): preserve real Blitz immediate-focus and Escape proof"
          git push origin HEAD:feat/reference-fixtures
